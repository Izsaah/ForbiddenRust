[package]
name = "p2p-gdextension"
version = "0.1.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
futures = "0.3"
godot = { version = "0.5.5", features = ["api-4-3"] }
libp2p = { version = "0.57", features = [
    "autonat", "dcutr", "identify", "macros", "mdns", "noise", "ping",
    "quic", "relay", "tcp", "tokio", "yamux",
] }
libp2p-stream = "0.5.0-alpha"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tunnel-core = { path = "../tunnel-core", version = "0.1.1" }
